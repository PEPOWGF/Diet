<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f7d5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Diario Dieta">
<title>Diario Dieta</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#1b231f;--mut:#667069;--line:#e0e5df;--ac:#2f7d5b;--ac2:#e5f2ea;--warn:#b45309;--warnbg:#fff4e5;--bad:#b91c1c;--badbg:#fdecec;--ok:#15803d;--wat:#2563eb;--watbg:#e8f0fe;--bar:#e8ece7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2320;--tx:#e8eeea;--mut:#9aa6a0;--line:#2c3733;--ac:#4cc08c;--ac2:#1e3329;--warn:#f0b35a;--warnbg:#3a2d17;--bad:#f28b8b;--badbg:#3b1d1d;--ok:#5fd08a;--wat:#7aa7ff;--watbg:#1c2b4a;--bar:#2a3430}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2320;--tx:#e8eeea;--mut:#9aa6a0;--line:#2c3733;--ac:#4cc08c;--ac2:#1e3329;--warn:#f0b35a;--warnbg:#3a2d17;--bad:#f28b8b;--badbg:#3b1d1d;--ok:#5fd08a;--wat:#7aa7ff;--watbg:#1c2b4a;--bar:#2a3430}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:12px 12px 96px;max-width:640px;margin:0 auto}
h1{font-size:22px;margin:4px 0 10px}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:15px;margin:12px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:9px 12px;min-height:40px}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.sm{padding:6px 10px;min-height:34px;font-size:14px}
button.wat{background:var(--watbg);color:var(--wat);border-color:transparent}
input,textarea{font:inherit;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:10px}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;padding:0}
label.chk{display:flex;gap:8px;align-items:center}
.strip{display:flex;gap:6px;margin-bottom:12px}
.dchip{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:12px;min-height:50px;font-size:12px}
.dchip b{font-size:16px}
.dchip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dchip.today:not(.on){border-color:var(--ac);color:var(--ac)}
.bar{height:9px;border-radius:6px;background:var(--bar);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.bar.wat i{background:var(--wat)}
.bar.over i{background:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{font-size:18px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ac2);color:var(--tx);border-radius:999px;padding:4px 6px 4px 12px;margin:3px 4px 3px 0;font-size:14px}
.chip button{border:0;background:transparent;padding:0 6px;min-height:24px;font-size:16px;color:var(--mut)}
.tg{display:inline-block;padding:7px 12px;border-radius:999px;border:1px solid var(--line);margin:3px 4px 3px 0;font-size:14px;background:var(--card)}
.tg.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ban{border-radius:14px;padding:12px;margin-bottom:10px;background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.ban.w{background:var(--watbg);color:var(--wat);border-color:var(--wat)}
.ban b{display:block;margin-bottom:6px}
.ban .row{margin-top:6px}
details{border-top:1px solid var(--line);padding:8px 0}
details:first-of-type{border-top:0}
summary{font-weight:600;cursor:pointer;padding:4px 0}
ul{margin:6px 0 6px 18px;padding:0}
li{margin:2px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px;z-index:10}
.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut);padding:4px}
.tabs button span{font-size:20px}
.tabs button.on{color:var(--ac);font-weight:700}
.st{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.ok{color:var(--ok)}.low{color:var(--warn)}.high{color:var(--bad)}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--ac2);color:var(--ac)}
.toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--tx);color:var(--bg);padding:12px;border-radius:12px;z-index:20;text-align:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>
<nav class="tabs" id="tabs">
<button data-a="tab" data-v="oggi"><span>📝</span>Oggi</button>
<button data-a="tab" data-v="sett"><span>📊</span>Settimana</button>
<button data-a="tab" data-v="piano"><span>📖</span>Piano</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DN=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const KEY='dieta_diario_v1';
let DB={days:{},set:{on:true,from:15,to:22}};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);DB.days=p.days||{};DB.set=Object.assign(DB.set,p.set||{});}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const widx=d=>(d.getDay()+6)%7;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const monday=d=>{const x=addDays(d,-widx(d));x.setHours(0,0,0,0);return x;};
const fmt=n=>Math.round(n*10)/10;
function day(s){if(!DB.days[s])DB.days[s]={water:0,coffee:0,sugar:0,meals:{}};return DB.days[s];}
function meal(s,k){const d=day(s);if(!d.meals[k])d.meals[k]={text:'',ing:[],cats:[],oil:0,salt:0,free:false};return d.meals[k];}
function peek(s,k){return DB.days[s]&&DB.days[s].meals[k]||null;}
function logged(M){return !!M&&!!(M.text.trim()||M.ing.length||M.cats.length||M.oil||M.salt||M.free);}

/* ---------- PIANO ---------- */
const PLAN=[
{pranzo:{s:'Poke',c:['pesce'],l:['Riso venere, basmati o cous cous 120g','Frutti di mare, trito di pesce, gamberetti, mazzancolle 150g o tonno sott\'olio sgocciolato (conf. 160g) o salmone marinato 200g','Verdura di stagione a volontà']},
 cena:{s:'Frittata / uova',c:['uova'],l:['Pane integrale 100g o riso basmati 80g','Frittata con 2 uova o uova strapazzate 120g','Verdura di stagione a volontà']}},
{pranzo:{s:'Pasta/cereale con legumi',c:['legumi'],l:['Pasta, riso, orzo, farro o cous cous 120g','Legumi freschi o in barattolo 150g, secchi 50g (es. piselli o ceci)','Verdure di stagione a volontà']},
 cena:{s:'Pesce',c:['pesce'],l:['Pane preferibilmente integrale 100g','Pesce fresco o surgelato (salmone, platessa, code di rospo, calamari o altro) 250g','Verdura o funghi a volontà']}},
{pranzo:{s:'Pasta con formaggio fresco',c:['formaggio'],l:['Pasta 120g o orecchiette fresche 150g','Ricotta fresca 150g o mozzarella light 1 bocconcino 125g o philadelphia light o stracchino 100g o fiocchi di latte 175g o primo sale 100g','Verdura di stagione a volontà']},
 cena:{s:'Pollo / tacchino',c:['carne'],l:['Pane integrale o ai cereali 100g','Petto di pollo grigliato o scaloppine al limone o tacchino 200g','Verdura di stagione a volontà']}},
{pranzo:{s:'Pasta/cereale con legumi',c:['legumi'],l:['Pasta, riso, orzo, farro o cous cous 120g','Legumi freschi o in barattolo 150g, secchi 50g (es. fagioli o piselli)','Verdure di stagione a volontà']},
 cena:{s:'Hamburger / tagliata',c:['carne'],l:['Pane integrale o ai cereali 100g oppure patate 300g','Hamburger di carne magra e selezionata 200g o tagliata di manzo o bistecca 200g','Verdura di stagione a volontà']}},
{pranzo:{s:'Pasta con frittata',c:['uova'],l:['Pasta 120g o riso basmati 120g (riso alla cantonese o carbonara di verdure)','Frittata con 2 uova o uova strapazzate','Verdura di stagione a volontà']},
 cena:{s:'Pesce',c:['pesce'],l:['Pane integrale o ai cereali 100g o patate 300g','Tagliata di tonno, filetto di pesce gratinato al forno o in padella, filetti di salmone, alici scottadito o seppie con piselli o code di rospo 250g','Verdure di stagione a volontà']}},
{pranzo:{s:'Pollo / tacchino',c:['carne'],l:['Pane integrale 80g','Petto di pollo grigliato o scaloppine al limone o tacchino 200g','Verdura di stagione a volontà']},
 cena:{s:'Pasto libero',c:[],free:true,l:['PASTO LIBERO (uno a settimana)']}},
{pranzo:{s:'Primo della domenica',c:['carne'],l:['Tagliatelle fresche all\'uovo 120g o tortellini 200g o pasta 100g','Ragù di carne macinata e selezionata 100g + parmigiano 20g (2 cucchiai grandi) o sugo di pesce misto o salmone per pasta 150g','Verdura o funghi a volontà']},
 cena:{s:'Formaggio fresco',c:['formaggio'],l:['Pane integrale 80g o riso basmati 60g','Ricotta fresca 200g o mozzarella light 1 bocconcino 125g o philadelphia light o stracchino 100g o fiocchi di latte 175g','Verdura di stagione a volontà']}}
];
const SLOT={pranzo:'☀️ Pranzo',cena:'🌙 Cena',altro:'🍎 Colazione, spuntini, extra'};
const CATS={pesce:'🐟 Pesce',formaggio:'🧀 Formaggio',carne:'🍗 Carne',affettati:'🥓 Affettati',uova:'🥚 Uova',legumi:'🫘 Legumi'};
const KW={
affettati:['bresaola','prosciutto','arrosto di tacchino','arrostino','affettat'],
pesce:['salmone','tonno','sgombro','sardin','alic','merluzzo','orata','spigola','gamber','cozze','vongol','scamp','polpo','platessa','sogliola','calamar','seppi','trota','aringa','pesce','mazzancoll','rospo','palombo','razza','sugello','suro','storione','spada','frutti di mare'],
formaggio:['ricotta','mozzarella','fiocchi di latte','primo sale','parmigian','stracchino','philadelphia','phidelphia','robiola','certosa','formaggio'],
carne:['pollo','tacchino','coniglio','vitello','equino','maiale','manzo','hamburger','bistecca','tagliata di manzo','ragù','ragu','macinata','scaloppin','carne'],
uova:['uova','uovo','frittata'],
legumi:['fagioli','piselli','ceci','lenticchie','fava','fave','lupini','cicerchia','legumi','humus','hummus']};
function detect(n){let t=' '+n.toLowerCase()+' ';const out=[];
 if(KW.affettati.some(k=>t.includes(k))){out.push('affettati');KW.affettati.forEach(k=>{t=t.split(k).join(' ');});}
 ['pesce','formaggio','carne','uova','legumi'].forEach(c=>{if(KW[c].some(k=>t.includes(k)))out.push(c);});
 return out;}
const AVOID=['mortadella','salsiccia','wurstel','würstel','burro','glassa','birra'];
function avoidHit(n){const t=n.toLowerCase();return AVOID.find(a=>t.includes(a))||(/\bvino\b/.test(t)&&!t.includes('aceto')?'vino':null);}

/* ---------- STATE ---------- */
let tab='oggi',sel=ymd(new Date()),repMon=ymd(monday(new Date()));
let needWater=false,lastHour=null,wAck=null;
function toast(m){const t=$('#toast');t.innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>{t.innerHTML='';},3500);}
function bar(v,max,cls){const p=Math.min(100,max?v/max*100:0);return '<div class="bar '+(cls||'')+(v>max&&cls!=='wat'?' over':'')+'"><i style="width:'+p+'%"></i></div>';}
function totals(s){const D=DB.days[s];let oil=0,salt=0;if(D)Object.values(D.meals).forEach(m=>{oil+=+m.oil||0;salt+=+m.salt||0;});return{oil,salt};}

/* ---------- BANNERS ---------- */
function inWin(h){return DB.set.on&&h>=DB.set.from&&h<=DB.set.to;}
function bannersHTML(){
 const now=new Date(),h=now.getHours(),today=ymd(now);
 if(sel!==today)return '';
 const P=PLAN[widx(now)];let out='';
 if(needWater&&inWin(h)&&(DB.days[today]?DB.days[today].water:0)<2.5){
  out+='<div class="ban w"><b>💧 Ora di bere un po\' d\'acqua</b>Sei a '+fmt(DB.days[today]?DB.days[today].water:0)+' L su 2,5 L.<div class="row"><button class="sm wat" data-a="water" data-v="0.2" data-ack="1">+0,2 L</button><button class="sm wat" data-a="water" data-v="0.5" data-ack="1">+0,5 L</button><button class="sm" data-a="ackWater">Più tardi</button></div></div>';}
 if(h>=12&&!logged(peek(today,'pranzo')))out+='<div class="ban"><b>🍽️ Pranzo: cosa hai mangiato?</b>Nel piano oggi: '+esc(P.pranzo.s)+'. Registra cibo, olio e sale.<div class="row"><button class="sm" data-a="goto" data-k="pranzo">Registra pranzo</button></div></div>';
 if(h>=19&&!logged(peek(today,'cena')))out+='<div class="ban"><b>🌙 Cena: cosa hai mangiato?</b>Nel piano stasera: '+esc(P.cena.s)+'. Registra cibo, olio e sale.<div class="row"><button class="sm" data-a="goto" data-k="cena">Registra cena</button></div></div>';
 return out;}

/* ---------- VIEW OGGI ---------- */
function mealCard(k,wi){
 const M=meal(sel,k),P=PLAN[wi][k];
 let planBlock='';
 if(P){planBlock='<details><summary>Piano di '+DN[wi]+': '+esc(P.s)+'</summary><ul>'+P.l.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><button class="sm" data-a="follow" data-k="'+k+'">✅ Ho seguito il piano</button></details>';}
 else planBlock='<details><summary>Cosa prevede il piano</summary><ul><li><b>Colazione</b>: frutta fresca 150g + mandorle/nocciole 10 o noci 2 o anacardi/pistacchi 10g o cioccolato fondente ≥85% 10g; oppure frutta 150g + shaker whey 30g</li><li><b>Spuntino mattina</b>: pancake Milk pro n.2 con velo di marmellata/miele; o cracker Galbusera/Misura + parmigiano stick 20g (max 2 volte); o pane integrale 60g + crudo/bresaola/arrostino 30g (max 2-3 volte), salmone affumicato 50g, humus 50g o philadelphia/ricotta 50g; + frutta 150g</li><li><b>Spuntino pomeriggio</b>: frutta 150g + yogurt greco 2% 170g / skyr 150g / kefir 150g / mousse proteica 200g (max 2 volte), o shaker whey 30g; cereali 40g solo nei giorni di allenamento</li><li><b>In più</b>: frutta 150g, cioccolato fondente ≥85% 10g. Max 1 banana al giorno</li></ul></details>';
 const cats=Object.keys(CATS).map(c=>'<span class="tg'+(M.cats.includes(c)?' on':'')+'" data-a="cat" data-k="'+k+'" data-v="'+c+'">'+CATS[c]+'</span>').join('');
 const chips=M.ing.map((g,i)=>'<span class="chip">'+esc(g.n)+(g.g?' · '+esc(g.g)+'g':'')+'<button data-a="rmIng" data-k="'+k+'" data-i="'+i+'">×</button></span>').join('');
 return '<div class="card" id="m-'+k+'"><div class="row sp"><h2>'+SLOT[k]+'</h2>'+(logged(M)?'<span class="badge">registrato</span>':'<span class="mut">da registrare</span>')+'</div>'+planBlock+
 '<h3>Cosa hai mangiato</h3><textarea data-f="txt" data-k="'+k+'" placeholder="Descrivi il pasto">'+esc(M.text)+'</textarea>'+
 '<h3>Ingredienti</h3><div>'+(chips||'<span class="mut">Nessun ingrediente inserito</span>')+'</div>'+
 '<div class="row" style="margin-top:6px;flex-wrap:nowrap"><input id="in-'+k+'" data-f="ing" data-k="'+k+'" placeholder="Ingrediente (es. salmone)" style="flex:3"><input id="ig-'+k+'" type="number" inputmode="decimal" placeholder="g" style="flex:1;min-width:64px"><button class="pri" data-a="addIng" data-k="'+k+'">+</button></div>'+
 '<h3>Tipo di alimenti (per il report)</h3><div>'+cats+'</div>'+
 '<div class="grid" style="margin-top:10px"><div><div class="mut">🫒 Olio (g)</div><input type="number" inputmode="decimal" data-f="oil" data-k="'+k+'" value="'+(M.oil||'')+'" placeholder="0"><div class="row" style="margin-top:6px"><button class="sm" data-a="add" data-f="oil" data-k="'+k+'" data-v="5">+5</button><button class="sm" data-a="add" data-f="oil" data-k="'+k+'" data-v="10">+10</button><button class="sm" data-a="add" data-f="oil" data-k="'+k+'" data-v="-9999">0</button></div></div>'+
 '<div><div class="mut">🧂 Sale (g)</div><input type="number" inputmode="decimal" step="0.1" data-f="salt" data-k="'+k+'" value="'+(M.salt||'')+'" placeholder="0"><div class="row" style="margin-top:6px"><button class="sm" data-a="add" data-f="salt" data-k="'+k+'" data-v="0.5">+0,5</button><button class="sm" data-a="add" data-f="salt" data-k="'+k+'" data-v="1">+1</button><button class="sm" data-a="add" data-f="salt" data-k="'+k+'" data-v="-9999">0</button></div></div></div>'+
 '<label class="chk" style="margin-top:12px"><input type="checkbox" data-f="free" data-k="'+k+'"'+(M.free?' checked':'')+'> Pasto libero (uno a settimana)</label></div>';}

function vOggi(){
 const d=parse(sel),mon=monday(d),wi=widx(d),now=new Date(),D=day(sel),T=totals(sel);
 let strip='<div class="strip">';
 for(let i=0;i<7;i++){const dd=addDays(mon,i),s=ymd(dd);strip+='<button class="dchip'+(s===sel?' on':'')+(s===ymd(now)?' today':'')+'" data-a="sel" data-v="'+s+'"><span>'+DN[i].slice(0,3)+'</span><b>'+dd.getDate()+'</b></button>';}
 strip+='</div>';
 const wn=Math.round(D.water*10)/10;
 let h='<h1>'+DN[wi]+' '+d.getDate()+'/'+(d.getMonth()+1)+'</h1><div class="row sp" style="margin-bottom:8px"><button class="sm" data-a="week" data-v="-7">‹ Sett.</button><button class="sm" data-a="today">Oggi</button><button class="sm" data-a="week" data-v="7">Sett. ›</button></div>'+strip+
 '<div id="banners">'+bannersHTML()+'</div>'+
 '<div class="card"><h2>Riepilogo del giorno</h2>'+
 '<div class="row sp"><b>💧 Acqua</b><span>'+fmt(D.water)+' / 2,5 L</span></div>'+bar(D.water,2.5,'wat')+
 '<div class="row"><button class="sm wat" data-a="water" data-v="0.2">+ bicchiere 0,2 L</button><button class="sm wat" data-a="water" data-v="0.5">+ bottiglia 0,5 L</button><button class="sm" data-a="water" data-v="-0.2">−</button></div>'+
 '<div class="row sp" style="margin-top:12px"><b>🫒 Olio extravergine</b><span class="'+(T.oil>40?'high':'')+'">'+fmt(T.oil)+' / 40 g</span></div>'+bar(T.oil,40)+
 '<div class="row sp"><b>🧂 Sale</b><span class="'+(T.salt>5?'high':'')+'">'+fmt(T.salt)+' / 5 g</span></div>'+bar(T.salt,5)+
 '<div class="grid" style="margin-top:8px"><div class="stat"><div class="mut">☕ Caffè (max 2)</div><b class="'+(D.coffee>2?'high':'')+'">'+D.coffee+'</b><div class="row" style="margin-top:6px"><button class="sm" data-a="coffee" data-v="1">+1</button><button class="sm" data-a="coffee" data-v="-1">−</button></div></div>'+
 '<div class="stat"><div class="mut">🍯 Zucchero/miele (max 5 g)</div><b class="'+(D.sugar>5?'high':'')+'">'+fmt(D.sugar)+' g</b><div class="row" style="margin-top:6px"><button class="sm" data-a="sugar" data-v="5">+5</button><button class="sm" data-a="sugar" data-v="-5">−</button></div></div></div>'+
 '<p class="mut" style="margin-bottom:0">Olio: 4 cucchiai da minestra (40 g) al giorno, 1 cucchiaino = 5 g, 1 cucchiaio = 10 g. Sale: max 5 g/giorno, meglio iodato.</p></div>'+
 mealCard('altro',wi)+mealCard('pranzo',wi)+mealCard('cena',wi)+

/* ---------- VIEW SETTIMANA ---------- */
function stat(n,min,max){if(n<min)return'low';if(n>max)return'high';return'ok';}
function weekData(ms){
 const mon=parse(ms);const c={pesce:0,formaggio:0,carne:0,affettati:0,uova:0,legumi:0,libero:0,meals:0};
 const ing={};const rows=[];let oilS=0,saltS=0,waterS=0,coffeeS=0,sugarS=0,dl=0,oilOver=0,saltOver=0,waterOk=0,coffeeOver=0,sugarOver=0,wd=0;
 for(let i=0;i<7;i++){const s=ymd(addDays(mon,i)),D=DB.days[s];let t={oil:0,salt:0},n=0;
  if(D){t=totals(s);
   Object.keys(D.meals).forEach(k=>{const m=D.meals[k];if(!logged(m))return;if(k!=='altro')n++;if(k!=='altro')c.meals++;
    new Set(m.cats).forEach(x=>{c[x]++;});if(m.free)c.libero++;
    m.ing.forEach(g=>{const key=g.n.trim().toLowerCase();if(!key)return;if(!ing[key])ing[key]={n:g.n.trim(),c:0,g:0};ing[key].c++;ing[key].g+=+g.g||0;});});
   const any=n>0||t.oil||t.salt||D.water||D.coffee||D.sugar||Object.values(D.meals).some(logged);
   if(any){dl++;oilS+=t.oil;saltS+=t.salt;if(t.oil>40)oilOver++;if(t.salt>5)saltOver++;}
   if(D.water>0){wd++;waterS+=D.water;if(D.water>=2.5)waterOk++;}
   coffeeS+=D.coffee;if(D.coffee>2)coffeeOver++;sugarS+=D.sugar;if(D.sugar>5)sugarOver++;}
  rows.push({s,i,D,t,n});}
 c.carneTot=c.carne+c.affettati;
 return{c,ing,rows,oilS,saltS,waterS,wd,dl,oilOver,saltOver,waterOk,coffeeS,coffeeOver,sugarS,sugarOver};}
function reportLines(W){const c=W.c;return[
 ['🐟 Pesce (min 3)',c.pesce,stat(c.pesce,3,99)],
 ['🧀 Formaggi (1-2)',c.formaggio,stat(c.formaggio,1,2)],
 ['🍗 Carne, affettati inclusi (3-4)',c.carneTot,stat(c.carneTot,3,4)],
 ['🥓 Affettati (max 1)',c.affettati,stat(c.affettati,0,1)],
 ['🥚 Uova (2-4)',c.uova,stat(c.uova,2,4)],
 ['🫘 Legumi (min 3)',c.legumi,stat(c.legumi,3,99)],
 ['🎉 Pasto libero (1)',c.libero,stat(c.libero,0,1)]];}
function vSett(){
 const mon=parse(repMon),end=addDays(mon,6),W=weekData(repMon),L=reportLines(W);
 const lab=mon.getDate()+'/'+(mon.getMonth()+1)+' – '+end.getDate()+'/'+(end.getMonth()+1);
 let h='<h1>Resoconto settimanale</h1><div class="row sp" style="margin-bottom:10px"><button class="sm" data-a="rep" data-v="-7">‹</button><b>'+lab+'</b><button class="sm" data-a="rep" data-v="7">›</button></div>'+
 '<div class="card"><h2>Frequenze di consumo</h2><div class="mut" style="margin-bottom:6px">Pasti registrati (pranzo + cena): '+W.c.meals+' / 14</div>'+
 L.map(r=>'<div class="st"><span>'+r[0]+'</span><b class="'+r[2]+'">'+r[1]+(r[2]==='ok'?' ✓':r[2]==='low'?' · pochi':' · troppi')+'</b></div>').join('')+
 '<p class="mut" style="margin-bottom:0">Conta i pasti in cui compare ogni categoria.</p></div>'+
 '<div class="card"><h2>Medie e limiti</h2>'+
 '<div class="st"><span>💧 Acqua media (giorni registrati)</span><b>'+(W.wd?fmt(W.waterS/W.wd):0)+' L</b></div>'+
 '<div class="st"><span>Giorni con almeno 2,5 L</span><b class="'+(W.waterOk>=W.wd&&W.wd?'ok':'low')+'">'+W.waterOk+' / '+W.wd+'</b></div>'+
 '<div class="st"><span>🫒 Olio medio al giorno</span><b>'+(W.dl?fmt(W.oilS/W.dl):0)+' g (tot '+fmt(W.oilS)+' g)</b></div>'+
 '<div class="st"><span>Giorni oltre 40 g di olio</span><b class="'+(W.oilOver?'high':'ok')+'">'+W.oilOver+'</b></div>'+
 '<div class="st"><span>🧂 Sale medio al giorno</span><b>'+(W.dl?fmt(W.saltS/W.dl):0)+' g (tot '+fmt(W.saltS)+' g)</b></div>'+
 '<div class="st"><span>Giorni oltre 5 g di sale</span><b class="'+(W.saltOver?'high':'ok')+'">'+W.saltOver+'</b></div>'+
 '<div class="st"><span>☕ Caffè totali · giorni oltre 2</span><b class="'+(W.coffeeOver?'high':'')+'">'+W.coffeeS+' · '+W.coffeeOver+'</b></div>'+
 '<div class="st"><span>🍯 Zucchero/miele · giorni oltre 5 g</span><b class="'+(W.sugarOver?'high':'')+'">'+fmt(W.sugarS)+' g · '+W.sugarOver+'</b></div></div>'+
 '<div class="card"><h2>Giorno per giorno</h2><div class="scroll"><table><tr><th>Giorno</th><th>Pasti</th><th>Acqua</th><th>Olio</th><th>Sale</th></tr>'+
 W.rows.map(r=>'<tr><td>'+DN[r.i].slice(0,3)+'</td><td>'+r.n+'/2</td><td>'+(r.D?fmt(r.D.water):0)+' L</td><td class="'+(r.t.oil>40?'high':'')+'">'+fmt(r.t.oil)+' g</td><td class="'+(r.t.salt>5?'high':'')+'">'+fmt(r.t.salt)+' g</td></tr>').join('')+'</table></div></div>'+
 '<div class="card"><h2>Ingredienti della settimana</h2>'+(Object.keys(W.ing).length?Object.values(W.ing).sort((a,b)=>b.c-a.c).map(g=>'<span class="chip" style="padding-right:12px">'+esc(g.n)+' ×'+g.c+(g.g?' · '+fmt(g.g)+'g':'')+'</span>').join(''):'<span class="mut">Nessun ingrediente inserito in questa settimana.</span>')+'</div>'+
 '<div class="card"><button class="pri" data-a="copy" style="width:100%">📋 Copia il resoconto</button></div>';
 $('#app').innerHTML=h;}
function reportText(){const W=weekData(repMon),mon=parse(repMon),end=addDays(mon,6);
 let t='RESOCONTO '+mon.getDate()+'/'+(mon.getMonth()+1)+' – '+end.getDate()+'/'+(end.getMonth()+1)+'\nPasti registrati: '+W.c.meals+'/14\n';
 reportLines(W).forEach(r=>{t+=r[0]+': '+r[1]+'\n';});
 t+='Acqua media: '+(W.wd?fmt(W.waterS/W.wd):0)+' L (giorni ≥2,5 L: '+W.waterOk+')\nOlio medio: '+(W.dl?fmt(W.oilS/W.dl):0)+' g/giorno, giorni >40 g: '+W.oilOver+'\nSale medio: '+(W.dl?fmt(W.saltS/W.dl):0)+' g/giorno, giorni >5 g: '+W.saltOver+'\nCaffè: '+W.coffeeS+'\n';
 const ig=Object.values(W.ing).sort((a,b)=>b.c-a.c).map(g=>g.n+' x'+g.c);
 t+='Ingredienti: '+(ig.join(', ')||'-');return t;}

 '<div class="card"><h2>Condimenti e altro</h2><ul><li><b>Olio extravergine di oliva</b>: 40 g al giorno (4 cucchiai da minestra o 8 cucchiaini)</li><li><b>Sale</b>: massimo 5 g per tutto il giorno, meglio iodato</li><li><b>Zucchero/miele</b>: max 5 g al giorno (2 cucchiaini, preferire il miele)</li><li>Limone: uno al giorno, anche come condimento · Aceto a volontà (no glassa) · Pomodoro a volontà</li><li>Burro da limitare · Vino e birra no · Marmellata senza zuccheri aggiunti · Erbe aromatiche e spezie sì · Dolcificanti (stevia) moderato</li><li>Parmigiano: come da dieta · Caffè: massimo 1-2 al giorno</li></ul>'+

 $('#app').innerHTML=h;}

/* ---------- RENDER / EVENTS ---------- */
function render(){const y=window.scrollY;({oggi:vOggi,sett:vSett,piano:vPiano})[tab]();
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));window.scrollTo(0,y);}
function addIng(k){const n=$('#in-'+k),g=$('#ig-'+k);const name=n.value.trim();if(!name)return;
 const M=meal(sel,k);M.ing.push({n:name,g:parseFloat(g.value)||0});
 detect(name).forEach(c=>{if(!M.cats.includes(c))M.cats.push(c);});
 const a=avoidHit(name);if(a)toast('⚠️ Nel piano: "'+a+'" è da evitare o limitare');
 save();render();const nn=$('#in-'+k);if(nn)nn.focus();}
function act(a,ds){
 const k=ds.k,v=ds.v;
 if(a==='tab'){tab=v;render();window.scrollTo(0,0);}
 else if(a==='sel'){sel=v;render();}
 else if(a==='today'){sel=ymd(new Date());render();}
 else if(a==='week'){sel=ymd(addDays(parse(sel),+v));render();}
 else if(a==='rep'){repMon=ymd(addDays(parse(repMon),+v));render();}
 else if(a==='addIng')addIng(k);
 else if(a==='rmIng'){meal(sel,k).ing.splice(+ds.i,1);save();render();}
 else if(a==='cat'){const M=meal(sel,k),i=M.cats.indexOf(v);if(i>=0)M.cats.splice(i,1);else M.cats.push(v);save();render();}
 else if(a==='add'){const M=meal(sel,k);M[ds.f]=Math.max(0,fmt((+M[ds.f]||0)+(+v)));save();render();}
 else if(a==='follow'){const wi=widx(parse(sel)),P=PLAN[wi][k],M=meal(sel,k);P.c.forEach(c=>{if(!M.cats.includes(c))M.cats.push(c);});if(P.free)M.free=true;if(!M.text.trim())M.text=P.s+' (come da piano)';save();render();toast('Registrato come da piano. Aggiungi olio e sale.');}
 else if(a==='water'){const D=day(sel);D.water=Math.max(0,fmt(D.water+(+v)));if(ds.ack){wAck=new Date().getHours();needWater=false;}save();render();}
 else if(a==='ackWater'){needWater=false;wAck=new Date().getHours();render();}
 else if(a==='coffee'){const D=day(sel);D.coffee=Math.max(0,D.coffee+(+v));save();render();}
 else if(a==='sugar'){const D=day(sel);D.sugar=Math.max(0,fmt(D.sugar+(+v)));save();render();}
 else if(a==='goto'){const el=$('#m-'+k);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
 else if(a==='testWater'){needWater=true;notify();render();}
 else if(a==='notif'){try{if(!('Notification' in window)){toast('Notifiche non disponibili in questa pagina');return;}Notification.requestPermission().then(p=>toast(p==='granted'?'Notifiche attivate':'Notifiche non concesse'));}catch(e){toast('Notifiche non disponibili');}}
 else if(a==='copy'){const t=reportText();try{navigator.clipboard.writeText(t).then(()=>toast('Resoconto copiato'),()=>toast('Copia non riuscita'));}catch(e){toast('Copia non riuscita');}}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset);});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f==='txt'){meal(sel,t.dataset.k).text=t.value;save();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.f==='ing'){e.preventDefault();addIng(e.target.dataset.k);}});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f;if(!f)return;
 if(f==='oil'||f==='salt'){meal(sel,t.dataset.k)[f]=Math.max(0,parseFloat(t.value)||0);save();render();}
 else if(f==='free'){meal(sel,t.dataset.k).free=t.checked;save();render();}
 else if(f==='on'){DB.set.on=t.checked;save();}
 else if(f==='from'||f==='to'){DB.set[f]=Math.min(23,Math.max(0,parseInt(t.value)||0));save();}});

/* ---------- WATER REMINDER ---------- */
function notify(){try{if(navigator.vibrate)navigator.vibrate(200);}catch(e){}
 try{if('Notification' in window&&Notification.permission==='granted')new Notification('💧 Ora di bere',{body:'Un bicchiere d\'acqua adesso.'});}catch(e){}}
function tick(){const now=new Date(),h=now.getHours();
 if(inWin(h)&&lastHour!==h&&wAck!==h){lastHour=h;needWater=true;notify();}
 if(!inWin(h))needWater=false;
 if(tab==='oggi'){const b=$('#banners');if(b){const html=bannersHTML();if(b.innerHTML!==html)b.innerHTML=html;}}}
render();tick();setInterval(tick,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
</script>
