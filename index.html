html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:12px 12px 96px;max-width:640px;margin:0 auto}

.mut{color:var(--mut);font-size:13px}

.sp{justify-content:space-between}

button.sm{padding:6px 10px;min-height:34px;font-size:14px}
button.wat{background:var(--watbg);color:var(--wat);border-color:transparent}
input,textarea{font:inherit;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:10px}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;padding:0}
label.chk{display:flex;gap:8px;align-items:center}
.strip{display:flex;gap:6px;margin-bottom:12px}
.dchip{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:12px;min-height:50px;font-size:12px}
.dchip b{font-size:16px}
.dchip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dchip.today:not(.on){border-color:var(--ac);color:var(--ac)}
.bar{height:9px;border-radius:6px;background:var(--bar);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.bar.wat i{background:var(--wat)}
.bar.over i{background:var(--bad)}
.bar.fib i{background:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{font-size:18px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ac2);color:var(--tx);border-radius:999px;padding:4px 6px 4px 12px;margin:3px 4px 3px 0;font-size:14px}
.chip button{border:0;background:transparent;padding:0 6px;min-height:24px;font-size:16px;color:var(--mut)}
.tg{display:inline-block;padding:7px 12px;border-radius:999px;border:1px solid var(--line);margin:3px 4px 3px 0;font-size:14px;background:var(--card)}
.tg.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ban{border-radius:14px;padding:12px;margin-bottom:10px;background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.ban.w{background:var(--watbg);color:var(--wat);border-color:var(--wat)}
.ban b{display:block;margin-bottom:6px}
.ban .row{margin-top:6px}
details{border-top:1px solid var(--line);padding:8px 0}
details:first-of-type{border-top:0}
summary{font-weight:600;cursor:pointer;padding:4px 0}
ul{margin:6px 0 6px 18px;padding:0}
li{margin:2px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px;z-index:10}
.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut);padding:4px}
.tabs button span{font-size:20px}
.tabs button.on{color:var(--ac);font-weight:700}
.st{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.ok{color:var(--ok)}.low{color:var(--warn)}.high{color:var(--bad)}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--ac2);color:var(--ac)}
.toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--tx);color:var(--bg);padding:12px;border-radius:12px;z-index:20;text-align:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
datalist{display:none}
</style>

const FOODS=[];FOODS_RAW.forEach(g=>g[1].forEach(r=>FOODS.push({cat:g[0],n:r[0],k:r[1],p:r[2],c:r[3],f:r[4],s:r[5],fi:r[6],por:r[7]})));
function allFoods(){return FOODS.concat((DB.custom||[]).map(x=>Object.assign({cat:'Miei alimenti',custom:1},x)));}
function fillList(){const d=$('#foods');if(d)d.innerHTML=allFoods().map(f=>'<option value="'+esc(f.n)+'">').join('');}
function findFood(q){q=String(q||'').trim().toLowerCase();if(!q)return null;const A=allFoods();
 let r=A.find(x=>x.n.toLowerCase()===q);if(r)return r;
 let c=A.filter(x=>x.n.toLowerCase().includes(q));if(c.length)return c.sort((a,b)=>a.n.length-b.n.length)[0];
 c=A.filter(x=>q.includes(x.n.toLowerCase().split(' (')[0]));if(c.length)return c.sort((a,b)=>b.n.length-a.n.length)[0];
 return null;}
function scale(f,gr){const k=gr/100;return [f.k,f.p,f.c,f.f,f.s||0,f.fi||0].map(x=>x*k);}
function nutOf(g){if(g.nu)return g.nu;const f=findFood(g.n);if(!f)return null;return scale(f,g.g>0?g.g:(f.por||100));}
const TG={kcal:2250,p:125,c:281,f:70,s:25,fib:25};
const NK=['kcal','p','c','f','s','fib'];
function zero(){return{kcal:0,p:0,c:0,f:0,s:0,fib:0,unk:0};}
function mealN(M){const N=zero();M.ing.forEach(g=>{const a=nutOf(g);if(!a){N.unk++;return;}NK.forEach((k,i)=>{N[k]+=a[i];});});
 const o=+M.oil||0;N.kcal+=o*9;N.f+=o;N.s+=o*0.14;return N;}
function dayN(s){const N=zero(),D=DB.days[s];if(!D)return N;
 Object.values(D.meals).forEach(M=>{const m=mealN(M);NK.forEach(k=>{N[k]+=m[k];});N.unk+=m.unk;});
 const sg=+D.sugar||0;N.kcal+=sg*3.9;N.c+=sg;return N;}
function mealLine(M){const N=mealN(M);if(!N.kcal&&!N.unk)return '';
 return '<div class="mut" style="margin-top:4px">≈ '+Math.round(N.kcal)+' kcal · P '+fmt(N.p)+' g · C '+fmt(N.c)+' g · L '+fmt(N.f)+' g'+(N.unk?' · '+N.unk+' senza valori':'')+'</div>';}

function stat(n,min,max){if(n<min)return'low';if(n>max)return'high';return'ok';}
function weekData(ms){
 const mon=parse(ms);const c={pesce:0,formaggio:0,carne:0,affettati:0,uova:0,legumi:0,libero:0,meals:0};
 const ing={};const rows=[];let oilS=0,saltS=0,waterS=0,coffeeS=0,sugarS=0,dl=0,oilOver=0,saltOver=0,waterOk=0,coffeeOver=0,sugarOver=0,wd=0,tr=0,cd=0,nd=0,kcalOver=0,nutS={kcal:0,p:0,c:0,f:0,s:0,fib:0};
 for(let i=0;i<7;i++){const s=ymd(addDays(mon,i)),D=DB.days[s],nu=dayN(s);let t={oil:0,salt:0},n=0;if(nu.kcal>0){nd++;NK.forEach(x=>{nutS[x]+=nu[x];});if(nu.kcal>TG.kcal)kcalOver++;}
  if(D){t=totals(s);if(D.train)tr++;else if(D.cardio)cd++;
   Object.keys(D.meals).forEach(k=>{const m=D.meals[k];if(!logged(m))return;if(k==='pranzo'||k==='cena'){n++;c.meals++;}
    new Set(m.cats).forEach(x=>{c[x]++;});if(m.free)c.libero++;
    m.ing.forEach(g=>{const key=g.n.trim().toLowerCase();if(!key)return;if(!ing[key])ing[key]={n:g.n.trim(),c:0,g:0};ing[key].c++;ing[key].g+=+g.g||0;});});
   const any=n>0||t.oil||t.salt||D.water||D.coffee||D.sugar||Object.values(D.meals).some(logged);
   if(any){dl++;oilS+=t.oil;saltS+=t.salt;if(t.oil>40)oilOver++;if(t.salt>5)saltOver++;}
   if(D.water>0){wd++;waterS+=D.water;if(D.water>=2.5)waterOk++;}
   coffeeS+=D.coffee;if(D.coffee>2)coffeeOver++;sugarS+=D.sugar;if(D.sugar>5)sugarOver++;}
  rows.push({s,i,D,t,n,nu});}
 c.carneTot=c.carne+c.affettati;
 return{nd,kcalOver,nutS,tr,cd,c,ing,rows,oilS,saltS,waterS,wd,dl,oilOver,saltOver,waterOk,coffeeS,coffeeOver,sugarS,sugarOver};}

function foodRow(f){const por=f.por||100;
 return '<div class="st"><div><b>'+esc(f.n)+'</b><div class="mut">Porzione indicativa '+por+' g ≈ '+Math.round(f.k*por/100)+' kcal</div></div><div style="text-align:right;white-space:nowrap"><b>'+Math.round(f.k)+'</b> kcal<div class="mut">P '+fmt(f.p)+' · C '+fmt(f.c)+' · L '+fmt(f.f)+'</div>'+(f.custom?'<button class="sm" data-a="delFood" data-n="'+esc(f.n)+'">elimina</button>':'')+'</div></div>';}
function foodRows(){const q=fq.trim().toLowerCase(),A=allFoods().filter(f=>!q||f.n.toLowerCase().includes(q));
 if(!A.length)return '<span class="mut">Nessun alimento trovato.</span>';
 const cats=[];A.forEach(f=>{if(!cats.includes(f.cat))cats.push(f.cat);});
 return cats.map(c=>'<h3>'+esc(c)+'</h3>'+A.filter(f=>f.cat===c).map(foodRow).join('')).join('');}
function vCibi(){
 const inp=(id,ph)=>'<input id="'+id+'" type="number" inputmode="decimal" step="0.1" placeholder="'+ph+'">';
 $('#app').innerHTML='<h1>Alimenti</h1><p class="mut" style="margin-top:0">Valori indicativi per 100 g di alimento crudo (o come indicato), con la porzione tipica del piano. P = proteine, C = glucidi, L = lipidi.</p>'+
 '<input id="fsearch" data-f="fq" placeholder="Cerca un alimento (es. riso)" value="'+esc(fq)+'" style="margin-bottom:10px">'+
 '<div class="card" id="flist">'+foodRows()+'</div>'+
 '<div class="card"><h2>Aggiungi un alimento</h2><p class="mut" style="margin-top:0">Inserisci i valori per 100 g, come da etichetta.</p><input id="cn" placeholder="Nome (es. Pizza surgelata)"><div class="grid" style="margin-top:8px">'+inp('ck','Kcal')+inp('cp','Proteine g')+inp('cc','Glucidi g')+inp('cf','Lipidi g')+inp('cs','Saturi g (facolt.)')+inp('cfi','Fibre g (facolt.)')+'</div><div style="margin-top:8px">'+inp('cpor','Porzione tipica in g')+'</div><button class="pri" style="width:100%;margin-top:10px" data-a="addFood">Salva alimento</button></div>';}

/* ---------- VIEW PIANO ---------- */
function vPiano(){
 const ti=widx(new Date());
 let days=PLAN.map((p,i)=>'<details'+(i===ti?' open':'')+'><summary>'+DN[i]+(i===ti?' · oggi':'')+'</summary>'+['colazione','mattina','pranzo','pomeriggio','cena'].map(k=>'<b>'+SLOT[k]+' – '+esc(p[k].s)+'</b><ul>'+p[k].l.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>').join('')+'</details>').join('');
 const h='<h1>Il mio piano</h1>'+
 '<div class="card"><h2>Obiettivi</h2><div class="grid"><div class="stat"><div class="mut">Energia media</div><b>2250 kcal</b></div><div class="stat"><div class="mut">Carboidrati / Proteine / Lipidi</div><b>50% / 22% / 28%</b></div><div class="stat"><div class="mut">Proteine max · Glucidi · Lipidi</div><b>125 · 281 · 70 g</b></div><div class="stat"><div class="mut">Fibra</div><b>25-30 g/die</b></div></div>'+
 '<ul><li>Dieta ipocalorica; grassi saturi &lt;10% delle calorie totali; zuccheri semplici &lt;15%</li><li>Colesterolo &lt;300 mg/die; equilibrio nutrizionale</li><li>Acqua: almeno 2,5 L al di fuori dei pasti (5 bottigliette da 0,5 L o circa 12 bicchieri)</li><li>Attività fisica: palestra + almeno 30 minuti di cardio nei giorni OFF</li></ul></div>'+
 '<div class="card"><h2>Menu settimanale</h2><p class="mut" style="margin-top:0">Pasta, riso (basmati, thai, venere, rosso, integrale), farro, orzo, cous cous, quinoa sono intercambiabili nelle stesse quantità. Si possono invertire i menu giornalieri in blocco e il pranzo con la cena. Un pasto libero a settimana. Colazioni e spuntini sono una rotazione costruita con le opzioni del piano, rispettando i limiti (yogurt/skyr max 2 volte, affettati max 1, formaggi 1-2 a settimana).</p>'+days+'</div>'+
 '<div class="card"><h2>Alimenti e frequenze</h2>'+
 '<details open><summary>🐟 Pesce: minimo 3 volte a settimana</summary>Prediligere pesce azzurro e pesci grassi di piccola taglia: sardina, sgombro, sugarello (suro), tonno, trota di lago, salmone, orata, spigola, aringa, merluzzo, sogliola, palombo, coda di rospo, razza, platessa (acciuga/alici barrate nel piano). Crostacei e molluschi: gamberi, gamberetti, cozze, vongole, scampi, polpo. Affumicati: salmone, pesce spada, tonno, storione. Scatolame: tonno, sardine, sgombro all\'olio (da sgocciolare).</details>'+
 '<details><summary>🧀 Formaggi: 1-2 volte a settimana</summary>Ricotta fresca, fiocchi di latte, mozzarella light, primo sale, parmigiano, stracchino, philadelphia light, robiola, certosa.</details>'+
 '<details><summary>🍗 Carne: 3-4 volte a settimana</summary>Affettati inclusi, massimo 1 volta a settimana. Private del grasso visibile. Preferire carni magre bianche: pollo, tacchino, coniglio. Carni rosse (taglio magro): vitello, equino, maiale, manzo (meglio da animali da pascolo, allevati a erba). Affettati: bresaola, prosciutto crudo sgrassato (es. Parma), arrosto di tacchino. <b>Evitare</b> mortadella, salsiccia, wurstel e carni separate meccanicamente.</details>'+
 '<details><summary>🥚 Uova: 2-4 a settimana</summary></details>'+
 '<details><summary>🫘 Legumi: almeno 3 volte a settimana</summary>Fagioli di ogni tipo, piselli, ceci, lenticchie, fava, lupini, cicerchia. Sciacquare accuratamente i legumi e tutti i prodotti in scatola.</details>'+
 '<details><summary>🥬 Verdura e frutta</summary>Verdura tutta a volontà e di stagione; porzione minima 200 g cotta o 80 g cruda. Alternare sempre verdure cotte e crude ai pasti principali. Frutta fresca e secca di stagione; massimo 1 banana al giorno, non troppo matura.</details>'+
 '<details><summary>🍞 Pane, pasta, riso, cereali, patate</summary>Porzioni come da menu; alternare i cereali, preferire i prodotti integrali. Sostituzioni di 100 g di pane: pasta 80 g, cereali 80 g, frisella integrale 80 g, 8 wasa, 8 granetti integrali.</details></div>'+
 '<div class="card"><h2>Colazione e spuntini</h2>'+
 '<details open><summary>Colazione</summary><ul><li>1-2 bicchieri di acqua prima di colazione</li><li>Frutta fresca 150g (1 frutto grande o 2 piccoli) + mandorle o nocciole 10, o noci intere 2, o anacardi/pistacchi al naturale 10g, o cioccolato fondente minimo 85% 10g</li><li>Oppure frutta fresca 150g + shaker di proteine whey (1 misurino da 30g)</li></ul></details>'+
 '<details><summary>Spuntino mattina</summary><ul><li>Merenda 1: pancake Milk pro n.2 con un velo di marmellata o miele</li><li>Oppure: cracker Galbusera o Misura (1 pacchetto) + parmigiano stick 20g (massimo 2 volte)</li><li>Oppure: pane ai cereali o integrale 60g + crudo, bresaola, arrostino 30g (max 2-3 volte), o salmone affumicato 50g, o humus di ceci 50g, o philadelphia/ricotta 50g</li><li>Merenda 2: frutta fresca 150g</li></ul></details>'+
 '<details><summary>Spuntino pomeriggio</summary><ul><li>Frutta fresca 150g + yogurt greco 2% (170g) o skyr 150g o kefir 150g o mousse proteica 200g (max 2 volte)</li><li>Oppure, se non consumato al mattino: frutta fresca 150g + shaker whey 30g</li><li>Cereali 40g solo nei giorni di allenamento</li></ul></details>'+
 '<details><summary>In più nella giornata</summary>Frutta fresca 150g e cioccolato fondente minimo 85% 10g. Quello che non viene consumato nella giornata si può recuperare in qualsiasi altro momento, anche dopo cena.</details></div>'+
 '<div class="card"><h2>Condimenti e altro</h2><ul><li><b>Olio extravergine di oliva</b>: 40 g al giorno (4 cucchiai da minestra o 8 cucchiaini)</li><li><b>Sale</b>: massimo 5 g per tutto il giorno, meglio iodato</li><li><b>Zucchero/miele</b>: max 5 g al giorno (2 cucchiaini, preferire il miele)</li><li>Limone: uno al giorno, anche come condimento · Aceto a volontà (no glassa) · Pomodoro a volontà</li><li>Burro da limitare · Vino e birra no · Marmellata senza zuccheri aggiunti · Erbe aromatiche e spezie sì · Dolcificanti (stevia) moderato</li><li>Parmigiano: come da dieta · Caffè: massimo 1-2 al giorno</li></ul>'+
 '<h3>Metodi di cottura</h3>Arrosto, al vapore, al cartoccio, in padella, al forno, alla griglia, al microonde, bolliti, con pomodoro. Sgocciolare bene tonno e sgombro sott\'olio.'+
 '<h3>Pesi e misure</h3><table><tr><td>Cucchiaino da zucchero</td><td>5 g</td><td>Tazza da latte</td><td>250 g</td></tr><tr><td>Cucchiaio da tavola</td><td>10 g</td><td>Scodella</td><td>350 g</td></tr><tr><td>Tazza da caffè</td><td>60 g</td><td>Bicchiere da vino</td><td>125-150 g</td></tr><tr><td>Tazza da tè</td><td>150 g</td><td>Bicchiere d\'acqua</td><td>200 g</td></tr></table></div>'+
 '<div class="card"><h2>Indicazioni specifiche</h2><ul><li>Mangiare lentamente: durata minima del pasto 20 minuti, quando possibile</li><li>1-2 bicchieri di acqua prima dei pasti principali</li><li>Il peso delle pietanze si riferisce alle sostanze crude al netto degli scarti</li><li>Scegliere sempre verdura e frutta di stagione</li><li>Con i vari alimenti si possono creare ricette personalizzate rispettando grammature e condimenti consentiti</li><li>Se non sei abituato a tanta frutta e verdura, aumentala gradualmente insieme all\'acqua: serve un paio di settimane per abituarsi (apporto di fibra aumentato)</li></ul><p class="mut">Piano della Dott.ssa Sara Del Papa, biologa nutrizionista, Fermo, 11 Ottobre 2026. Per dubbi contatta la dottoressa.</p></div>';
 $('#app').innerHTML=h;}

/* ---------- RENDER / EVENTS ---------- */
function render(){const y=window.scrollY;({oggi:vOggi,sett:vSett,piano:vPiano,cibi:vCibi})[tab]();
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));window.scrollTo(0,y);}
function addIng(k){const n=$('#in-'+k),g=$('#ig-'+k);const name=n.value.trim();if(!name)return;
 const M=meal(sel,k),f=findFood(name);let gr=parseFloat(g.value)||0;const it={n:name,g:gr};
 if(f){if(!gr){gr=f.por||100;it.g=gr;}it.nu=scale(f,gr);}
 M.ing.push(it);
 detect(name+' '+(f?f.n:'')).forEach(c=>{if(!M.cats.includes(c))M.cats.push(c);});
 let msg='';const a=avoidHit(name);if(a)msg='⚠️ Nel piano: "'+a+'" è da evitare o limitare. ';
 msg+=f?f.n+' '+gr+' g ≈ '+Math.round(it.nu[0])+' kcal':'Valori non trovati per "'+name+'": aggiungilo in Alimenti';
 toast(msg);save();render();const nn=$('#in-'+k);if(nn)nn.focus();}
function act(a,ds){
 const k=ds.k,v=ds.v;
 if(a==='tab'){tab=v;render();window.scrollTo(0,0);}
 else if(a==='sel'){sel=v;render();}
 else if(a==='today'){sel=ymd(new Date());render();}
 else if(a==='week'){sel=ymd(addDays(parse(sel),+v));render();}
 else if(a==='rep'){repMon=ymd(addDays(parse(repMon),+v));render();}
 else if(a==='addIng')addIng(k);
 else if(a==='rmIng'){meal(sel,k).ing.splice(+ds.i,1);save();render();}
 else if(a==='cat'){const M=meal(sel,k),i=M.cats.indexOf(v);if(i>=0)M.cats.splice(i,1);else M.cats.push(v);save();render();}
 else if(a==='add'){const M=meal(sel,k);M[ds.f]=Math.max(0,fmt((+M[ds.f]||0)+(+v)));save();render();}
 else if(a==='follow'){const wi=widx(parse(sel)),P=PLAN[wi][k],M=meal(sel,k);P.c.forEach(c=>{if(!M.cats.includes(c))M.cats.push(c);});if(P.free)M.free=true;if(!M.text.trim())M.text=P.s+' (come da piano)';save();render();toast('Registrato come da piano. Aggiungi olio e sale.');}
 else if(a==='water'){const D=day(sel);D.water=Math.max(0,fmt(D.water+(+v)));if(ds.ack){wAck=new Date().getHours();needWater=false;}save();render();}
 else if(a==='ackWater'){needWater=false;wAck=new Date().getHours();render();}
 else if(a==='coffee'){const D=day(sel);D.coffee=Math.max(0,D.coffee+(+v));save();render();}
 else if(a==='sugar'){const D=day(sel);D.sugar=Math.max(0,fmt(D.sugar+(+v)));save();render();}
 else if(a==='goto'){const el=$('#m-'+k);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
 else if(a==='testWater'){needWater=true;notify();render();}
 else if(a==='notif'){try{if(!('Notification' in window)){toast('Notifiche non disponibili in questa pagina');return;}Notification.requestPermission().then(p=>toast(p==='granted'?'Notifiche attivate':'Notifiche non concesse'));}catch(e){toast('Notifiche non disponibili');}}
 else if(a==='addFood'){const g=id=>parseFloat(($('#'+id)||{}).value)||0,name=(($('#cn')||{}).value||'').trim();
  if(!name||!g('ck')){toast('Inserisci almeno nome e kcal per 100 g');return;}
  DB.custom=(DB.custom||[]).filter(x=>x.n.toLowerCase()!==name.toLowerCase());
  DB.custom.push({n:name,k:g('ck'),p:g('cp'),c:g('cc'),f:g('cf'),s:g('cs'),fi:g('cfi'),por:g('cpor')||100});save();fillList();render();toast('Alimento salvato');}
 else if(a==='delFood'){DB.custom=(DB.custom||[]).filter(x=>x.n!==ds.n);save();fillList();render();}
 else if(a==='bkExport'){const t=JSON.stringify({days:DB.days,custom:DB.custom,set:DB.set});try{navigator.clipboard.writeText(t).then(()=>toast('Backup copiato: incollalo in Note'),()=>toast('Copia non riuscita'));}catch(e){toast('Copia non riuscita');}}
 else if(a==='bkImport'){const v=(($('#bkin')||{}).value||'').trim();if(!v){toast('Incolla prima il backup');return;}
  try{const o=JSON.parse(v);if(!o||typeof o.days!=='object')throw 0;if(!confirm('Sostituire tutti i dati attuali con il backup?'))return;
   DB.days=o.days;DB.custom=o.custom||[];DB.set=Object.assign({on:true,from:15,to:22},o.set||{});save();fillList();render();toast('Backup ripristinato');}catch(e){toast('Backup non valido');}}
 else if(a==='copy'){const t=reportText();try{navigator.clipboard.writeText(t).then(()=>toast('Resoconto copiato'),()=>toast('Copia non riuscita'));}catch(e){toast('Copia non riuscita');}}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset);});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f==='fq'){fq=t.value;const l=$('#flist');if(l)l.innerHTML=foodRows();return;}if(t.dataset.f==='txt'){meal(sel,t.dataset.k).text=t.value;save();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.f==='ing'){e.preventDefault();addIng(e.target.dataset.k);}});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f;if(!f)return;
 if(f==='oil'||f==='salt'){meal(sel,t.dataset.k)[f]=Math.max(0,parseFloat(t.value)||0);save();render();}
 else if(f==='free'){meal(sel,t.dataset.k).free=t.checked;save();render();}
 else if(f==='train'){day(sel).train=t.checked;save();render();}
 else if(f==='cardio'){day(sel).cardio=t.checked;save();}
 else if(f==='on'){DB.set.on=t.checked;save();}
 else if(f==='from'||f==='to'){DB.set[f]=Math.min(23,Math.max(0,parseInt(t.value)||0));save();}});

/* ---------- WATER REMINDER ---------- */
function notify(){try{if(navigator.vibrate)navigator.vibrate(200);}catch(e){}
 try{if('Notification' in window&&Notification.permission==='granted')new Notification('💧 Ora di bere',{body:'Un bicchiere d\'acqua adesso.'});}catch(e){}}
function tick(){const now=new Date(),h=now.getHours();
 if(inWin(h)&&lastHour!==h&&wAck!==h){lastHour=h;needWater=true;notify();}
 if(!inWin(h))needWater=false;
 if(tab==='oggi'){const b=$('#banners');if(b){const html=bannersHTML();if(b.innerHTML!==html)b.innerHTML=html;}}}
fillList();render();tick();setInterval(tick,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
</script>
</body>
